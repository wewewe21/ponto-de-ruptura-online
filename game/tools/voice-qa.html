<!doctype html><html lang="pt-BR"><head><base href="/"><meta charset="utf-8"><title>Vozes · Ponto de Ruptura</title><script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/addons/"}}</script><style>body{background:#0c171d;color:#dce9eb;font:17px system-ui;max-width:900px;margin:50px auto;padding:20px}button{background:#243d48;color:#fff;border:1px solid #7b9a9e;border-radius:4px;padding:12px 20px;margin:5px;cursor:pointer}label{display:block;margin:25px 0}#status{padding:20px;border-left:3px solid #efbf6c;background:#172832}small{color:#abc0c4}</style></head><body><h1>Vozes em português brasileiro</h1><p>Gravações do jogo, geradas localmente pelo ComfyUI. Cada personagem tem sua identidade de voz.</p><div id="cast"></div><label><input id="radio" type="checkbox" checked> Comunicação por rádio</label><button id="stop">PARAR</button><p id="status">Carregando falas…</p><small>Desmarque o rádio para ouvir a voz normal de perto. O volume geral segue o áudio do navegador.</small><script type="module">
import {GameAudio} from '/src/core/audio.js';
const audio=new GameAudio(),status=document.querySelector('#status');
await audio.loadVoices();
const examples={TROVÃO:'Recebido, Corvo. Martelo-2, posição?',FAÍSCA:'Um já foi. Faltam dois e um banho quente.',ATALAIA:'Atenção, Colosso inimigo no campo de batalha!',CORUJA:'Tenho o Barqueiro. Barco, quinhentos metros, no reservatório.',BARQUEIRO:'A vila dele está sessenta metros abaixo da água que vocês vieram proteger.','CORVO-1':'Martelo-1 em solo. Boa caçada, pessoal.',HOSTIL:'O vale lembra, irmão. O vale lembra.',ECO:'De volta à operação.'};
for(const [speaker,text]of Object.entries(examples)){const b=document.createElement('button');b.textContent=speaker;b.onclick=()=>{audio.init();audio.setRain(0);audio.vol.music=0;audio.setVolumes();audio.tts=true;status.textContent='Carregando áudio de '+speaker+'…';status.dataset.state='loading';audio.speak(text,speaker,{radio:document.querySelector('#radio').checked,channel:'qa',onStart:duration=>{status.textContent=`REPRODUZINDO · ${speaker} · ${duration.toFixed(1)}s · ${text}`;status.dataset.state='playing';},onEnd:()=>{status.textContent=`CONCLUÍDO · ${speaker} · ${text}`;status.dataset.state='complete';}});};document.querySelector('#cast').appendChild(b);}
document.querySelector('#stop').onclick=()=>{audio.stopSpeech();status.textContent='Reprodução interrompida.';status.dataset.state='stopped';};status.textContent=Object.keys(audio.speech.lines).length+' falas prontas · escolha um personagem.';
</script></body></html>
